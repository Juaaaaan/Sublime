<section class="relative h-dvh flex flex-col md:flex-row overflow-hidden">
  <!-- Imagen -->
  <div class="w-full md:w-1/2 md:h-dvh relative bg-surface-container-low">
    <img
      src="images/home/rc-hero-background.png"
      [alt]="'hero.image_alt' | transloco"
      class="w-full h-full object-cover"
    />
    <div class="absolute inset-0 bg-linear-to-r from-surface/20 to-transparent"></div>
  </div>

  <!-- Texto -->
  <div class="w-full md:w-1/2 px-8 md:px-xl py-lg bg-surface flex flex-col justify-center">
    <div class="">
      <span class="text-label-sm font-semibold text-primary mb-sm block uppercase tracking-widest">
        {{ 'hero.eyebrow' | transloco }}
      </span>

      <h1 class="text-h1 text-on-surface mb-md">
        {{ 'hero.title_before' | transloco }}
        <em class="italic">{{ 'hero.title_emphasis' | transloco }}</em>
        {{ 'hero.title_after' | transloco }}
      </h1>

      <p class="text-body-lg text-on-surface-variant mb-lg leading-relaxed">
        {{ 'hero.intro' | transloco }}
      </p>

      <div class="flex flex-col sm:flex-row gap-md">
        <app-button (clicked)="shopCollections.emit()" routerLink="/colecciones">
          {{ 'hero.cta_collections' | transloco }}
        </app-button>
        <app-button variant="secondary" routerLink="/contacto">
          {{ 'hero.cta_story' | transloco }}
        </app-button>
      </div>
    </div>
  </div>
</section>
