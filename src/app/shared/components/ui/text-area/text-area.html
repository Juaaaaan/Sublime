<div class="flex w-full flex-col gap-xs">
  @if (label()) {
    <label
      [for]="fieldId()"
      class="text-label-sm font-semibold tracking-label uppercase text-deep-moss"
    >
      {{ label() }}
      @if (required()) {
        <span class="text-error ml-1" aria-hidden="true">*</span>
      }
    </label>
  }

  <textarea
    [id]="fieldId()"
    [value]="value()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [attr.maxlength]="maxLength()"
    [class]="inputClasses()"
    (input)="onInput($event)"
  >
  </textarea>

  <div class="flex items-start justify-between">
    <div>
      @if (error()) {
        <span [id]="messageId()" class="text-label-sm text-error" role="alert">{{ error() }}</span>
      } @else if (hint()) {
        <span [id]="messageId()" class="text-label-sm text-secondary">{{ hint() }}</span>
      }
    </div>

    @if (maxLength()) {
      <span class="text-label-sm text-secondary ml-auto">
        {{ currentLength() }} / {{ maxLength() }}
      </span>
    }
  </div>
</div>
