@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center"
    (keydown)="onKeydown($event)"
    (click)="onBackdropClick($event)"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title() ? titleId : null"
  >
    <!--
      Backdrop. Lleva `#backdrop` porque es el elemento que recibe de verdad los clics de
      la zona oscura: tapa el overlay por completo, asi que comparar `target` con
      `currentTarget` nunca acertaba y cerrar pulsando el fondo no funcionaba.
    -->
    <div
      #backdrop
      class="absolute inset-0 bg-inverse-surface/20 backdrop-blur-sm transition-opacity duration-300"
    ></div>

    <!-- Panel -->
    <div cdkTrapFocus cdkTrapFocusAutoCapture [class]="panelClasses()">
      <!-- Header -->
      @if (title() || closeable()) {
        <div
          class="flex items-center justify-between px-lg py-md border-b border-outline-variant shrink-0"
        >
          @if (title()) {
            <h2 [id]="titleId" class="text-h3 text-on-surface">{{ title() }}</h2>
          }
          @if (closeable()) {
            <!--
              `type="button"` explicito: dentro de un formulario el valor por defecto es
              `submit`, asi que cerrar el modal enviaba el formulario. `min-h-11 min-w-11`
              lleva el area tactil a los 44px minimos (antes 36px) y el anillo de foco es
              el mismo que en `Button` y `Chip`.
            -->
            <button
              type="button"
              class="ml-auto inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-field text-on-surface-variant transition-colors duration-300 hover:text-on-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
              [attr.aria-label]="closeLabel()"
              (click)="close()"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          }
        </div>
      }

      <!-- Body -->
      <div class="overflow-y-auto px-lg py-md flex-1">
        <ng-content />
      </div>

      <!-- Footer (slot opcional) -->
      <div class="px-lg py-md border-t border-outline-variant shrink-0 empty:hidden">
        <ng-content select="[modal-footer]" />
      </div>
    </div>
  </div>
}
