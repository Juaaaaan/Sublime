<div class="flex w-full flex-col gap-xs">
  @if (label()) {
    <label
      [for]="fieldId()"
      class="text-label-sm font-semibold tracking-label uppercase text-deep-moss"
    >
      {{ label() }}
      @if (required()) {
        <span class="text-error ml-1" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="relative">
    <select
      [id]="fieldId()"
      [value]="value()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [class]="selectClasses()"
      (change)="onChange($event)"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="!value()">
          {{ placeholder() }}
        </option>
      }

      @for (option of options(); track option.value) {
        <option
          [value]="option.value"
          [disabled]="option.disabled ?? false"
          [selected]="option.value === value()"
        >
          {{ option.label }}
        </option>
      }
    </select>

    <!-- Chevron icon -->
    <div
      class="pointer-events-none absolute top-1/2 right-field-x -translate-y-1/2 text-deep-moss"
      aria-hidden="true"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>

  @if (error()) {
    <span [id]="messageId()" class="text-label-sm text-error" role="alert">{{ error() }}</span>
  } @else if (hint()) {
    <span [id]="messageId()" class="text-label-sm text-secondary">{{ hint() }}</span>
  }
</div>
