<div class="flex flex-col gap-xs w-full">
  @if (label()) {
    <span
      [id]="labelId"
      class="text-label-sm font-semibold tracking-label uppercase text-on-surface-variant mb-xs"
    >
      {{ label() }}
      @if (required()) {
        <span class="text-error ml-1" aria-hidden="true">*</span>
      }
    </span>
  }

  <div
    [class]="groupClasses()"
    role="radiogroup"
    [attr.aria-labelledby]="label() ? labelId : null"
    [attr.aria-describedby]="error() || hint() ? descriptionId : null"
    [attr.aria-required]="required()"
    [attr.aria-invalid]="error() ? true : null"
  >
    @for (option of options(); track option.value) {
      <label
        class="flex items-start gap-sm cursor-pointer group"
        [class.opacity-40]="isDisabled(option)"
        [class.pointer-events-none]="isDisabled(option)"
      >
        <!-- Input nativo oculto — accesibilidad correcta -->
        <input
          #radioInput
          type="radio"
          [name]="name()"
          [value]="option.value"
          [checked]="isSelected(option.value)"
          [disabled]="isDisabled(option)"
          class="sr-only peer"
          (change)="onChange(option.value)"
          (keydown)="onKeydown($event)"
        />

        <!-- Radio visual custom -->
        <span
          class="mt-px shrink-0 w-5 h-5 rounded-full border border-outline bg-surface-container-lowest transition-all duration-300 peer-checked:border-deep-moss peer-checked:border-[5px] peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-primary group-hover:border-deep-moss"
        >
        </span>

        <!-- Label + descripción -->
        <span class="flex flex-col">
          <span class="text-body-sm text-deep-moss transition-colors duration-300">
            {{ option.label }}
          </span>
          @if (option.description) {
            <span class="text-label-sm text-on-surface-variant mt-xs">
              {{ option.description }}
            </span>
          }
        </span>
      </label>
    }
  </div>

  @if (error()) {
    <span [id]="descriptionId" class="text-label-sm text-error" role="alert">{{ error() }}</span>
  } @else if (hint()) {
    <span [id]="descriptionId" class="text-label-sm text-on-surface-variant">{{ hint() }}</span>
  }
</div>
