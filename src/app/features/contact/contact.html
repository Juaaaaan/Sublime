<ng-container *transloco="let t" id="rc-contact">
  <app-intro-page-section [title]="t('contact.title')" [description]="t('contact.subtitle')" />

  <div
    class="max-w-[1200px] mx-auto px-gutter py-xl grid grid-cols-1 gap-lg md:grid-cols-2 md:items-start"
  >
    <div class="flex flex-col gap-md">
      <a
        [href]="'https://wa.me/' + contactInfo.whatsappNumber"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center justify-between gap-xs border-b border-outline-variant py-sm font-sans text-body-md text-on-surface transition-colors duration-300 hover:text-primary"
      >
        <span class="flex flex-col">
          <span>{{ t('contact.whatsapp') }}</span>
          <span class="text-on-surface-variant">{{ contactInfo.whatsappDisplay }}</span>
        </span>
        <span aria-hidden="true">&rarr;</span>
      </a>

      <a
        [href]="'mailto:' + contactInfo.email"
        class="flex items-center justify-between gap-xs border-b border-outline-variant py-sm font-sans text-body-md text-on-surface transition-colors duration-300 hover:text-primary"
      >
        <span class="flex flex-col">
          <span>{{ t('contact.emailLink') }}</span>
          <span class="text-on-surface-variant">{{ contactInfo.email }}</span>
        </span>
        <span aria-hidden="true">&rarr;</span>
      </a>

      <p
        class="rounded-lg bg-surface-container p-sm font-sans text-body-md text-on-surface-variant"
      >
        {{ t('contact.legalNotice') }}
      </p>

      <div class="border-t border-outline-variant pt-md">
        <p class="text-label-sm font-semibold uppercase tracking-widest text-on-surface-variant">
          {{ t('contact.studioLocation') }}
        </p>
        <!-- TODO RCA-28: dirección real pendiente de confirmación con la clienta -->
        <p class="mt-xs font-sans text-body-md text-on-surface">Madrid, Spain</p>
      </div>
    </div>

    <img
      ngSrc="https://picsum.photos/seed/contact-jewelry/445/334"
      width="445"
      height="334"
      class="w-full rounded-lg object-cover"
      [alt]="t('contact.title')"
    />
  </div>
</ng-container>
