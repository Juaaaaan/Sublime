<div class="flex flex-col gap-xs w-full">
  @if (label()) {
    <label
      [for]="id()"
      class="text-label-sm font-semibold tracking-label uppercase text-on-surface-variant"
    >
      {{ label() }}
      @if (required()) {
        <span class="text-error ml-1" aria-hidden="true">*</span>
      }
    </label>
  }

  <input
    [id]="id()"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [class]="inputClasses()"
    (input)="onInput($event)"
  />

  @if (error()) {
    <span class="text-label-sm text-error" role="alert">{{
      error()
    }}</span>
  } @else if (hint()) {
    <span class="text-label-sm text-on-surface-variant">{{
      hint()
    }}</span>
  }
</div>
